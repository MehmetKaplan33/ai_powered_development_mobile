<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Çukurova Üniversitesi - Login</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
      <style>
            * {
                  box-sizing: border-box;
                  margin: 0;
                  padding: 0;
                  font-family: 'Inter', sans-serif;
            }

            body,
            html {
                  height: 100%;
                  display: flex;
            }

            .left-panel {
                  width: 40%;
                  background-color: #fff;
                  padding: 40px;
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
            }

            .right-panel {
                  width: 60%;
                  overflow: hidden;
            }

            .right-panel img {
                  width: 100%;
                  height: 100vh;
                  object-fit: cover;
            }

            .logo {
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  margin-bottom: 20px;
            }

            .logo img {
                  height: 60px;
            }

            .logo-text {
                  font-size: 22px;
                  font-weight: bold;
            }

            h2 {
                  margin-bottom: 30px;
                  color: #444;
            }

            .input-group {
                  margin-bottom: 20px;
            }

            input {
                  width: 100%;
                  padding: 12px 14px;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                  font-size: 16px;
            }

            .icon-input {
                  display: flex;
                  align-items: center;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                  overflow: hidden;
            }

            .icon-input input {
                  border: none;
                  flex: 1;
                  padding: 12px;
            }

            .icon {
                  background-color: #004d26;
                  padding: 12px;
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: center;
            }

            .icon i {
                  font-size: 16px;
            }

            .forgot {
                  text-align: right;
                  margin-bottom: 20px;
                  font-size: 14px;
            }

            .forgot a {
                  color: #004d26;
                  text-decoration: none;
            }

            .btn {
                  width: 100%;
                  padding: 14px;
                  background-color: #004d26;
                  color: white;
                  border: none;
                  border-radius: 8px;
                  font-size: 16px;
                  cursor: pointer;
                  margin-bottom: 20px;
            }

            .or {
                  text-align: center;
                  margin-bottom: 20px;
                  color: #888;
            }

            .signup-btn {
                  width: 100%;
                  padding: 14px;
                  background-color: white;
                  color: #004d26;
                  border: 2px solid #004d26;
                  border-radius: 8px;
                  font-size: 16px;
                  cursor: pointer;
            }
      </style>
</head>

<body>

      <div class="left-panel">
            <div class="logo">
                  <img src="assets/image/cukurova_logo (1).png"
                        alt="CU Logo">
                  <div class="logo-text">Çukurova<br>Üniversitesi</div>
            </div>

            <h2>Login into your account</h2>

            <form>
                  <div class="input-group">
                        <div class="icon-input">
                              <input type="email" placeholder="alex@email.com" required />
                              <div class="icon">📧</div>
                        </div>
                  </div>

                  <div class="input-group">
                        <div class="icon-input">
                              <input type="password" placeholder="Enter your password" required />
                              <div class="icon">🔒</div>
                        </div>
                  </div>

                  <div class="forgot">
                        <a href="#">Forgot password?</a>
                  </div>

                  <button type="submit" class="btn">Login now</button>
                  <div class="or">OR</div>
                  <button type="button" class="signup-btn">Signup now</button>
            </form>
      </div>

      <div class="right-panel">
            <img src="assets/image/cukurova.jpeg" alt="Çukurova University Campus" />
      </div>

</body>

</html>
