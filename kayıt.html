<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çukurova Üniversitesi Giriş</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="container">
      <div class="left-panel">
        <div class="logo-screen">
          <img
            src="assets/image/cukurova_logo (1).png"
            alt="Çukurova Üniversitesi Logo"
          />

          <h1 style="color: #165a2f">
            Çukurova
            <br />
            Üniversitesi
          </h1>
        </div>
        <br />

        <form>
          <label>Name</label>
          <div class="input-group">
            <input type="text" placeholder="Name" required />
            <span class="icon"><i class="fa-regular fa-user"></i></span>
          </div>

          <label>Surname</label>
          <div class="input-group">
            <input type="text" placeholder="Surname" required />
            <span class="icon"><i class="fa-regular fa-user"></i></span>
          </div>
          <label>Email Adress</label>
          <div class="input-group">
            <input type="email" placeholder="mail@mail.com" required />
            <span class="icon"><i class="fa-regular fa-envelope"></i></span>
          </div>
          <label>Password</label>
          <div class="input-group">
            <input type="password" placeholder="Şifrenizi Giriniz" required id="passwordField"/>
            <span class="icon password-toggle" id="togglePassword">
              <i class="fa-solid fa-eye"></i>
            </span>
          </div>

          <button type="submit" class="login"><a href="#">Join Us</a></button>
        </form>
      </div>

      <div class="right-panel">
        <img src="assets/image/background.webp" alt="Çukurova Kampüs" />
      </div>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
