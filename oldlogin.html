<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş</title>
  <link rel="stylesheet" href="./assets/css/style.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/brands.min.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body, html {
  height: 100%;
  width: 100%;
  background-color: #f5f5f5;
}

.container {
  display: flex;
  height: 100vh;
  width: 100%;
}

/* Sol taraf (form paneli) */
.login-panel {
  width: 30%;
  background-color: #ffffff;
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
}

.logo {
  width: 80px;
  margin-bottom: 10px;
}

.login-panel h1 {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  color: #111827;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 30px;
}



form {
  width: 100%;
}

.input-group {
  position: relative;
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 14px 40px 14px 16px;
  border: solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  transition: border 0.3s ease;
}

.input-group input:focus {
  border-color: #2563eb;
  outline: none;
}

.input-group .icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: #6b7280;
}

.forgot {
  display: inline-block;
  margin-bottom: 20px;
  font-size: 13px;
  color: #2563eb;
  text-decoration: none;
}

.login-btn {
  width: 100%;
  background-color: #065f46;
  color: #fff;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.login-btn:hover {
  background-color: #047857;
}

.divider {
  text-decoration: none;
  text-align: center;
  margin-top: 10px;
  margin-bottom: 10px;
  color: #9ca3af;
}



.signup-btn {
  width: 100%;
  background-color: transparent;
  border: 2px solid #065f46;
  color: #065f46;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.signup-btn:hover {
  background-color: #065f46;
  color: white;
}

/* Sağ taraf (arka plan görseli) */
.image-panel {
  width: 70%;
  overflow: hidden;
}

.image-panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Mobil uyum */
@media screen and (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .login-panel, .image-panel {
    width: 100%;
    height: auto;
  }

  .login-panel {
    padding: 40px 20px;
  }
}

  </style>

</head>
<body>
  <div class="container">
    <div class="login-panel">
      <div class="logo">
        <img src="./assets/image/cukurova_logo (1).png" alt="Çukurova Üniversitesi Logo" class="logo">
      </div>
      <p class="subtitle">Hesabına Giriş Yap</p>

      <form>
        <div class="input-group">
          <input type="email" placeholder="E-Posta Adresiniz" required />
          <span class="icon"><i class="fa-solid fa-envelope"></i></span>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Şifreniz" required />
          <span class="icon"><i class="fa-solid fa-unlock"></i></span>
        </div>

        <a href="#" class="forgot">Şifreni mi unuttun ?</a>

        <button type="submit" class="login-btn">Giriş Yap</button>
      </form>

      <div class="divider"><span>VEYA</span></div>

      <button class="signup-btn">Kayıt Ol</button>
    </div>

    <div class="image-panel">
      <img src="./assets/image/background.webp" alt="Background" />
    </div>
  </div>
</body>
</html>
